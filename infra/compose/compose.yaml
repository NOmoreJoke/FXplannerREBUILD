# 12-Factor 合规的生产编排：
# - 所有环境变量通过 env_file 注入（不硬编码）
# - 必填 build arg 强制要求 NEXT_PUBLIC_API_BASE_URL
# - 端口由环境变量驱动，无硬编码
services:
  # 测试数据库（端口 5433，避免与开发库冲突）
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fxplanner_new_test
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5

  chat:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.chat
    # 生产环境变量（不进 git，由部署系统创建在服务器上）
    # 文件位置：infra/compose/chat.env
    env_file:
      - path: ./chat.env
        required: false
    environment:
      - NODE_ENV=production
      # 数据导出 ZIP 落盘目录（account-data 技术方案 §3.1 决策二；路径可经 chat.env 覆盖）
      - DATA_EXPORT_DIR=/app/services/chat/data-exports
    volumes:
      # 导出文件持久化（24h 下载期限内重建容器不丢文件）
      - export-data:/app/services/chat/data-exports
    # 端口由 .env 文件中的 API_PORT 变量驱动
    ports:
      - "${API_PORT:-4001}:${API_PORT:-4001}"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:${API_PORT:-4001}/api/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chat-web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
      args:
        # 构建期必传：前端 bundle inline 的 API 地址
        NEXT_PUBLIC_API_BASE_URL: >-
          ${NEXT_PUBLIC_API_BASE_URL:?
          NEXT_PUBLIC_API_BASE_URL build arg is required}
    # 运行时环境变量
    env_file:
      - path: ./web.env
        required: false
    environment:
      - NODE_ENV=production
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    depends_on:
      chat:
        condition: service_healthy

# 数据导出临时文件（EXPORT 请求生成，24h 下载期限内有效）
volumes:
  export-data:
