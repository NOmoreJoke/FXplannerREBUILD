---
# ============================================
# Relay docker.io images → ghcr.io（自建镜像中转）
# ============================================
# 背景：服务器直连 docker.io 不通（镜像源失效），ghcr 可用。
# 用法：gh workflow run relay-images.yml
#       -f images=postgres:16-alpine[,node:22-alpine]
# 效果：ghcr.io/jiangxiaoyu66/<name>:<tag>（library/ 前缀镜像去掉 library）
name: Relay Images

"on":
  workflow_dispatch:
    inputs:
      images:
        description: >-
          逗号分隔的 docker.io 镜像列表，如 postgres:16-alpine,redis:7-alpine
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Relay images
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          for img in $(echo "$IMAGES" | tr ',' ' '); do
            name="${img%%:*}"
            name="${name#library/}"
            name="$(echo "$name" | tr '/' '-')"
            target="ghcr.io/jiangxiaoyu66/${name}:${img##*:}"
            echo "==> ${img} → ${target}"
            docker pull --platform linux/amd64 "docker.io/${img#docker.io/}"
            docker tag "docker.io/${img#docker.io/}" "$target"
            docker push "$target"
          done
