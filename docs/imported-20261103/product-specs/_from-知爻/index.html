<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FXplanner · 资金规划工作台</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230f766e'/><text x='7' y='21' fill='white' font-size='11' font-family='serif'>FX</text></svg>">
<style>
:root{--ink:#102238;--muted:#64748b;--line:#dce4ea;--paper:#f4f7f8;--card:#fff;--teal:#0f766e;--teal2:#e6f5f2;--nav:#0b1726;--warn:#b86516;--warnbg:#fff7e9;--good:#158467;--shadow:0 12px 34px #17324d14}*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr;max-width:100%;overflow-x:hidden}.side{position:sticky;top:0;height:100vh;background:var(--nav);color:#d9e5f1;padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 24px}.mark{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;font:800 12px Georgia;color:white}.brand strong{font:700 20px Georgia,serif}.brand small{display:block;color:#7f95ab;font:11px/1.6 sans-serif}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#95a9bd;border-radius:9px;text-align:left;padding:11px 12px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#17334d;color:#fff}.nav i{width:18px;text-align:center;font-style:normal}.account{margin-top:auto;border-top:1px solid #20354a;padding:16px 8px 0;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dff5ef;color:var(--teal);font-weight:800}.account small{color:#8096ab}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{font-weight:700}.sync{margin-left:auto;color:var(--good);font-size:12px;border:1px solid #bfe5dc;background:#effaf7;border-radius:99px;padding:7px 11px}.content{padding:34px;max-width:1440px;margin:auto;overflow:hidden}.hero{display:flex;align-items:flex-start;gap:20px;margin-bottom:26px}.hero h1{font:700 30px/1.2 Georgia,"Songti SC",serif;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.hero .actions{margin-left:auto;display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 15px;color:var(--ink);font-weight:600}.btn:hover{border-color:#8dbab5}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.ghost{background:transparent}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:18px}.metric label,.eyebrow{font-size:12px;color:var(--muted)}.metric b{display:block;font:700 24px/1.4 Georgia,serif;margin:5px 0}.metric small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card{padding:22px}.card h2{font-size:16px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.account-row,.plan-row,.report-row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #edf1f4}.account-row:first-of-type,.plan-row:first-of-type,.report-row:first-of-type{border-top:0}.flag{display:flex;align-items:center;gap:10px;font-weight:700}.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-size:11px}.muted{color:var(--muted);font-size:12px}.focus{border-left:4px solid var(--teal);background:linear-gradient(120deg,#eff9f7,#fff);padding:18px;border-radius:10px}.focus b{display:block;margin-bottom:8px}.evidence{font-size:11px;color:var(--muted);margin:12px 0}.progress{height:8px;background:#e7edf0;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--teal);border-radius:inherit}.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs button{border:0;border-radius:8px;padding:8px 12px;background:#edf2f4;color:var(--muted)}.tabs button.active{background:var(--teal2);color:var(--teal);font-weight:700}.table-wrap{width:100%;overflow:auto}.table{width:100%;min-width:700px;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf1f4;font-size:13px}.table th{color:var(--muted);font-size:11px}.status{display:inline-block;border-radius:99px;padding:5px 9px;background:#e8f7f1;color:var(--good);font-size:11px}.status.wait{background:var(--warnbg);color:var(--warn)}.route{padding:18px;border:1px solid var(--line);border-radius:12px;margin-top:12px;display:grid;grid-template-columns:1.3fr repeat(3,1fr) auto;gap:14px;align-items:center}.route.best{border-color:#7fc8bd;background:#f3fbf9}.route strong{font-size:15px}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.node{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.node.done{border-color:#acdcd2;background:#f2fbf8}.node b{display:block;margin:6px 0}.notice{background:var(--warnbg);border:1px solid #f0d6ae;color:#7c4a16;border-radius:10px;padding:13px;font-size:13px}.modal-layer{position:fixed;inset:0;background:#0b172680;display:grid;place-items:center;z-index:20;padding:22px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 28px 80px #07132255;padding:26px}.modal h2{font:700 24px Georgia,"Songti SC",serif;margin:0 0 8px}.modal>p{color:var(--muted);margin:0 0 22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cad5dc;border-radius:9px;padding:11px 12px;background:#fbfcfd}.field textarea{min-height:80px;resize:vertical}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:18px;text-align:left}.choice:hover,.choice.selected{border-color:var(--teal);background:var(--teal2)}.choice b{display:block;margin:8px 0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.review{background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:16px}.review dl{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0}.review dt{font-size:11px;color:var(--muted)}.review dd{margin:3px 0 0;font-weight:700}.spinner{width:44px;height:44px;border:4px solid #d8e8e6;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:24px;bottom:24px;background:#102c2b;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:40;animation:rise .2s ease}@keyframes rise{from{transform:translateY(10px);opacity:0}}.empty{text-align:center;padding:45px;color:var(--muted)}.mobile-menu{display:none}.fade{animation:fade .18s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}
.btn:disabled{cursor:not-allowed;opacity:.55}.btn:disabled:hover{border-color:var(--line)}@media(max-width:900px){.app{display:block}.side{position:fixed;z-index:30;width:240px;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.mobile-menu{display:block;border:0;background:transparent;font-size:20px;margin-right:12px}.metrics{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.content{padding:22px}.timeline{grid-template-columns:1fr 1fr}.route{grid-template-columns:1fr 1fr}.hero{display:block}.hero .actions{margin-top:16px}.form-grid,.choices{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
const NEW_GOAL=()=>({name:'纽约留学准备金',currency:'USD',amount:'50,000',date:'2027-08-01',base:'CNY',preference:'均衡型'});const S={view:'home',planProgress:68,entryReturn:'accounts',entryCurrency:'USD',accountTab:'records',accountCurrency:'USD',balance:18420,cost:143872,cadBalance:8650,cadCost:49651,entryDraft:null,goalDraft:NEW_GOAL(),settings:{base:'HKD',language:'简体中文',threshold:'成本变化超过 0.5% 或 HK$100'},transactions:[['2026-07-30','买入','+$3,200 USD','HK$25,008','HK$25','USD'],['2026-07-28','卖出','−$800 USD','HK$6,248','HK$18','USD'],['2026-07-24','更正 · 买入','+$140 USD','HK$1,100','HK$12','USD'],['2026-07-03','买入','+$8,350 CAD','HK$47,929','HK$30','CAD']],goals:[{name:'加拿大秋季学费',currency:'CAD',amount:'25,000',preference:'平衡型',progress:68,safety:'2026-09-08',status:'监测中'},{name:'纽约留学准备金',currency:'USD',amount:'50,000',preference:'均衡型',progress:0,safety:'2027-07-12',status:'草稿'}],reports:[['加拿大秋季学费规划报告','report_v3.pdf','已完成'],['历史模拟 · CAD 学费','replay_0826.pdf','已完成']]};
const NAV=[['home','⌂','首页'],['accounts','▣','外汇账户'],['plans','◎','换汇计划'],['routes','⇄','路径比较'],['replay','◷','历史模拟'],['reports','▤','我的报告'],['settings','⚙','设置']];
const $=s=>document.querySelector(s),money=n=>n.toLocaleString('zh-CN');
function shell(content,title){return `<div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">FX</span><div><strong>FXplanner</strong><small>资金规划工作台</small></div></div><nav class="nav">${NAV.map(n=>`<button data-view="${n[0]}" class="${S.view===n[0]?'active':''}"><i>${n[1]}</i>${n[2]}</button>`).join('')}</nav><div class="account"><span class="avatar">K</span><div><b>Kai</b><small>订阅账户 · 简中</small></div></div></aside><main class="main"><header class="top"><button class="mobile-menu" id="menu">☰</button><span class="crumb">${title}</span><span class="sync">● 数据更新 09:30</span></header><section class="content fade">${content}</section></main></div>`}
function hero(title,sub,actions=''){return `<div class="hero"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function home(){const accounts=[['US','USD',`$${money(S.balance)}`,`HK$${money(S.cost)}`],['CA','CAD',`$${money(S.cadBalance)}`,`HK$${money(S.cadCost)}`],['JP','JPY','¥980,000','HK$52,857']],total=S.cost+S.cadCost+52857;return shell(hero('早上好，Kai','先看账户事实，再处理临近安全日期的资金目标。','<button class="btn" data-action="quick-entry">快速录入</button><button class="btn primary" data-action="new-goal">新建目标</button>')+`<div class="metrics"><div class="metric"><label>外汇账户</label><b>3 个</b><small>USD · CAD · JPY</small></div><div class="metric"><label>持仓总成本</label><b>HK$${money(total)}</b><small>按 HKD 本位币汇总</small></div><div class="metric"><label>最近目标进度</label><b>${S.planProgress}%</b><small>加拿大秋季学费</small></div><div class="metric"><label>最晚安全日期</label><b>2026-09-08</b><small>还有 30 天</small></div></div><div class="grid2"><div class="card"><h2>我的外汇账户</h2><p class="sub">余额、持仓成本与可用金额</p>${accounts.map(x=>`<div class="account-row"><div class="flag"><span class="coin">${x[0]}</span>${x[1]} 账户</div><b>${x[2]}</b><span class="muted">成本 ${x[3]}</span>${x[1]==='JPY'?'<button class="btn" disabled title="本次演示未制作 JPY 详情">未纳入演示</button>':`<button class="btn" data-account-currency="${x[1]}">查看</button>`}</div>`).join('')}</div><div class="card"><h2>优先处理</h2><p class="sub">基于安全日期和当前准备进度</p><div class="focus"><b>加拿大秋季学费需要补齐下一批资金</b><span class="muted">当前进度 ${S.planProgress}%，${S.planProgress>=75?'已达到今日保护线':'低于平衡型保护线 75%。建议补齐 $2,200 CAD。'}</span><div class="progress"><span style="width:${S.planProgress}%"></span></div><div class="evidence">参考数据 2026-07-13 09:30 HKT · 不构成汇率预测</div><button class="btn primary" data-action="open-plan">查看计划并确认</button></div></div></div>`,'首页')}
function accounts(){const cur=S.accountCurrency==='CAD'?'CAD':'USD',bal=cur==='CAD'?S.cadBalance:S.balance,cost=cur==='CAD'?S.cadCost:S.cost;const tabs=`<div class="tabs"><button data-account-tab="records" class="${S.accountTab==='records'?'active':''}">交易记录</button><button data-account-tab="fifo" class="${S.accountTab==='fifo'?'active':''}">FIFO 成本批次</button><button data-account-tab="goals" class="${S.accountTab==='goals'?'active':''}">关联目标</button></div>`;let body='';if(S.accountTab==='records')body=`<div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>类型</th><th>账户变动</th><th>成本依据</th><th>费用</th><th>状态</th></tr></thead><tbody>${S.transactions.filter(x=>x[5]===cur).map(x=>`<tr>${x.slice(0,5).map(y=>`<td>${y}</td>`).join('')}<td><span class="status">已确认</span></td></tr>`).join('')}</tbody></table></div>`;if(S.accountTab==='fifo')body=`<div class="table-wrap"><table class="table"><thead><tr><th>批次</th><th>入账日期</th><th>可用余额</th><th>单位成本</th></tr></thead><tbody><tr><td>LOT-${cur}-01</td><td>2026-07-30</td><td>$${money(bal)} ${cur}</td><td>${(cost/bal).toFixed(4)} HKD/${cur}</td></tr></tbody></table></div>`;if(S.accountTab==='goals')body=S.goals.filter(g=>g.currency===cur).map(g=>`<div class="plan-row"><b>${g.name}</b><span>${g.currency} ${g.amount}</span><span class="status ${g.status==='草稿'?'wait':''}">${g.status}</span><button class="btn" data-view="plans">查看</button></div>`).join('');return shell(hero(`${cur} 外汇账户`,'记录真实持仓与费用；所有录入先形成草稿，确认后才更新演示账本。','<button class="btn primary" data-action="quick-entry">录入交易记录</button>')+`<div class="metrics"><div class="metric"><label>当前余额</label><b>$${money(bal)} ${cur}</b><small>已结算余额</small></div><div class="metric"><label>持仓总成本</label><b>HK$${money(cost)}</b><small>含已知费用</small></div><div class="metric"><label>加权平均成本</label><b>${(cost/bal).toFixed(4)}</b><small>HKD / ${cur}</small></div><div class="metric"><label>可用于目标</label><b>$${money(Math.max(0,bal-(cur==='CAD'?8650:12000)))}</b><small>扣除已预留</small></div></div><div class="card">${tabs}${body}</div>`,`外汇账户 / ${cur}`)}
function plans(){return shell(hero('换汇计划','规划资金准备节奏，不执行交易、不预测汇率。','<button class="btn primary" data-action="new-goal">新建目标</button>')+`<div class="card"><h2>资金准备目标</h2><p class="sub">按最晚安全日期排序</p>${S.goals.map((g,i)=>`<div class="plan-row"><div><b>${g.name}</b><div class="muted">目标 ${g.amount} ${g.currency} · ${g.preference}</div></div><div><b>${i===0?S.planProgress:g.progress}%</b><div class="progress"><span style="width:${i===0?S.planProgress:g.progress}%"></span></div></div><div><b>${g.safety}</b><div class="muted">${g.status}</div></div><button class="btn" data-action="${i===0?'open-plan':'edit-goal'}" data-goal-index="${i}">${i===0?'查看计划':'编辑目标'}</button></div>`).join('')}</div>`,'换汇计划')}
function planDetail(){return shell(hero('加拿大秋季学费','目标 $25,000 CAD · 预计使用日 2026-09-15 · 最晚安全日期 2026-09-08','<button class="btn" data-action="record-execution">记录实际换汇</button><button class="btn primary" data-view="routes">比较路径</button>')+`<div class="metrics"><div class="metric"><label>目标金额</label><b>$25,000 CAD</b></div><div class="metric"><label>已准备</label><b>$${money(Math.round(25000*S.planProgress/100))} CAD</b></div><div class="metric"><label>当前进度</label><b>${S.planProgress}%</b></div><div class="metric"><label>保护曲线</label><b>75%</b><small>${S.planProgress>=75?'已达到今日保护线':'低于保护线 '+(75-S.planProgress)+' 个百分点'}</small></div></div><div class="card"><h2>累计准备进度</h2><div class="progress"><span style="width:${S.planProgress}%"></span></div><div class="notice">下一批至少准备 $2,200 CAD，确保在安全日期前达到 100%。</div></div><br><div class="card"><h2>分批计划</h2><p class="sub">计划保证最晚安全日期前达到目标金额 100%</p><div class="timeline">${[['批次 1','$8,650','已完成'],['批次 2','$8,350','已完成'],['批次 3','$2,200','待处理'],['批次 4','$3,800','计划中'],['批次 5','$2,000','计划中']].map((x,i)=>`<div class="node ${i<2||S.planProgress>=75&&i===2?'done':''}"><span class="status ${i>1?'wait':''}">${x[2]}</span><b>${x[0]}</b><span>${x[1]} CAD</span><div class="muted">${['06-20','07-03','07-18','08-12','09-08'][i]}</div></div>`).join('')}</div></div>`,'换汇计划 / 加拿大秋季学费')}
function routes(){return shell(hero('路径比较','按净到账口径比较预计总成本；未知或无上限费用不参与最低成本排序。','<button class="btn" data-action="refresh-routes">刷新报价</button>')+`<div class="notice">参考快照：2026-07-13 09:30 HKT · 有效期 15 分钟 · 仅供规划</div><div class="card" style="margin-top:18px"><h2>CNY → USD · 净到账 $10,000</h2><p class="sub">费用、结算时间与数据完整性同时纳入比较</p>${[['中国银行 → Wise','CNY 72,522','0.42%','1–2 日','推荐'],['招商银行电汇','CNY 72,680','0.58%','2–3 日','可用'],['Airwallex','费用待确认','—','1–2 日','不可排序']].map((x,i)=>`<div class="route ${i===0?'best':''}"><strong>${x[0]}</strong><div><span class="muted">预计总成本</span><br><b>${x[1]}</b></div><div><span class="muted">费用占比</span><br>${x[2]}</div><div><span class="muted">预计到账</span><br>${x[3]}</div>${i===0?'<button class="btn primary" data-action="adopt-route">采用此路径</button>':`<span class="status ${i===2?'wait':''}">${x[4]}</span>`}</div>`).join('')}</div>`,'路径比较')}
function replay(){return shell(hero('历史模拟','比较历史情境下的固定策略，不预测未来汇率。','<button class="btn primary" data-action="run-replay">运行回放</button>')+`<div class="grid2"><div class="card"><h2>回放条件</h2><div class="form-grid"><div class="field"><label>支付币种</label><select id="r-currency"><option>CAD</option></select></div><div class="field"><label>本位币</label><select><option>CNY</option></select></div><div class="field"><label>目标金额</label><input id="r-amount" value="12,000"></div><div class="field"><label>固定费用</label><input id="r-fee" value="35 CAD"></div></div></div><div class="card"><h2>历史节点</h2><p class="sub">3 / 20 个节点 · 合计 100%</p>${[['2024-09-01','40%'],['2024-12-15','35%'],['2025-03-01','25%']].map(x=>`<div class="account-row"><b>${x[0]}</b><span>${x[1]}</span><span class="muted">数据完整</span></div>`).join('')}</div></div><div class="card" style="margin-top:18px" id="replay-result"><div class="empty">运行后展示四种固定策略的可复现比较</div></div>`,'历史模拟')}
function reports(){return shell(hero('我的报告','报告固定事实快照、规则版本与证据索引。','<button class="btn primary" data-action="create-report">生成新报告</button>')+`<div class="card"><h2>报告与处理队列</h2><p class="sub">下载失败可凭恢复令牌重试</p>${S.reports.map(x=>`<div class="report-row"><div><b>${x[0]}</b><div class="muted">快照 snap_0826</div></div><span>${x[1]}</span><span class="status">${x[2]}</span><button class="btn" data-action="download-report">下载</button></div>`).join('')}</div>`,'我的报告')}
function settings(){return shell(hero('设置','管理区域、通知、隐私及 AI 集成。','<button class="btn primary" data-action="save-settings">保存设置</button>')+`<div class="grid2"><div class="card"><h2>本位币与区域</h2><div class="form-grid"><div class="field"><label>默认本位币</label><select id="set-base"><option ${S.settings.base==='HKD'?'selected':''}>HKD</option><option ${S.settings.base==='CNY'?'selected':''}>CNY</option></select></div><div class="field"><label>语言</label><select id="set-language"><option selected>简体中文</option></select></div></div></div><div class="card"><h2>通知与提醒</h2><div class="field"><label>提醒阈值</label><select id="set-threshold"><option selected>${S.settings.threshold}</option><option>仅安全日期提醒</option></select></div></div><div class="card"><h2>隐私与数据</h2><p class="sub">导出、删除与共享授权均需二次确认。</p><button class="btn" data-action="privacy">查看数据授权</button></div><div class="card"><h2>AI 与集成</h2><p class="sub">演示环境未连接真实模型或数据源。</p><span class="status wait">需配置</span></div></div>`,'设置')}
const V={home,accounts,plans,routes,replay,reports,settings,'plan-detail':planDetail};
function render(){app.innerHTML=(V[S.view]||home)();bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='quick-entry')S.entryCurrency=S.view==='accounts'?S.accountCurrency:'USD';if(b.dataset.action==='record-execution')S.entryCurrency='CAD';act(b.dataset.action,b)});document.querySelectorAll('[data-account-tab]').forEach(b=>b.onclick=()=>{S.accountTab=b.dataset.accountTab;render()});document.querySelectorAll('[data-account-currency]').forEach(b=>b.onclick=()=>{S.accountCurrency=b.dataset.accountCurrency;S.accountTab='records';go('accounts')});$('#menu')?.addEventListener('click',()=>$('#side').classList.toggle('open'))}
function go(v){S.view=v;closeModal();render();scrollTo(0,0)}
function toast(msg){$('#toast').innerHTML=`<div class="toast" role="status">${msg}</div>`;setTimeout(()=>$('#toast').replaceChildren(),2600)}
function closeModal(){$('#modal').replaceChildren()}
function openModal(html){$('#modal').innerHTML=`<div class="modal-layer"><section class="modal fade" role="dialog" aria-modal="true">${html}</section></div>`;$('#modal .modal-layer').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
function modalActions(next='继续',action=''){return `<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" data-modal-action="${action}">${next}</button></div>`}
function entryMethod(){openModal(`<h2>选择录入方式</h2><p>所有方式都先建立可复核草稿，只有确认后才写入演示账本。</p><div class="choices"><button class="choice" data-entry="form"><span>▤</span><b>表单录入</b><small>逐项填写单笔交易</small></button><button class="choice" data-entry="paste"><span>↑</span><b>上传或粘贴</b><small>识别回单与文本</small></button><button class="choice" data-entry="voice"><span>●</span><b>语音输入</b><small>说出金额、时间和费用</small></button></div>`);document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>entryForm(b.dataset.entry))}
function entryForm(mode='form'){const linked=S.entryReturn==='plan-detail',cad=linked||S.entryCurrency==='CAD';openModal(`<h2>${mode==='voice'?'语音交易草稿':'录入实际换汇'}</h2><p>当前录入账户：${cad?'CAD':'USD'}。识别结果不会自动写入；请核对金额、币种和费用。</p><div class="form-grid"><div class="field"><label>交易日期</label><input id="e-date" type="date" value="2026-08-29"></div><div class="field"><label>交易类型</label><select><option>买入外币</option></select></div><div class="field"><label>换出金额</label><input id="e-out" value="${linked?'12,628 HKD':cad?'11,480 HKD':'15,720 HKD'}"></div><div class="field"><label>换入金额</label><input id="e-in" value="${linked?'2,200 CAD':cad?'2,000 CAD':'2,000 USD'}"></div><div class="field"><label>全部费用</label><input id="e-fee" value="${linked?'35 HKD':'30 HKD'}"></div><div class="field"><label>关联目标</label><select><option>${linked?'加拿大秋季学费 · 批次 3':'暂不关联'}</option></select></div></div>${modalActions('生成复核草稿','parse-entry')}`);$('[data-modal-action="parse-entry"]').onclick=captureEntry}
function captureEntry(){S.entryDraft={date:$('#e-date').value,out:$('#e-out').value.trim(),incoming:$('#e-in').value.trim(),fee:$('#e-fee').value.trim()};entryProcessing()}
function entryProcessing(){openModal(`<div class="spinner"></div><h2 style="text-align:center">正在整理交易内容</h2><p style="text-align:center">仅生成待确认草稿，不会自动修改余额。</p><div class="review"><span class="status">来源读取完成</span>　字段完整性与重复交易检查进行中</div>${modalActions('解析完成，进入复核','review-entry')}`);$('[data-modal-action="review-entry"]').onclick=entryReview}
function entryReview(){const d=S.entryDraft;openModal(`<h2>确认交易草稿</h2><p>请确认后写入演示账本；关联计划仅在成功写账后更新。</p><div class="review"><dl><div><dt>日期</dt><dd>${d.date}</dd></div><div><dt>交易</dt><dd>${d.out} → ${d.incoming}</dd></div><div><dt>费用</dt><dd>${d.fee}</dd></div><div><dt>状态</dt><dd>尚未写入</dd></div></dl></div>${modalActions('确认并写入账本','confirm-entry')}`);$('[data-modal-action="confirm-entry"]').onclick=commitEntry}
function numberOf(v){return Number(String(v).replace(/[^\d.]/g,''))||0}
function commitEntry(){const d=S.entryDraft,back=S.entryReturn,inAmount=numberOf(d.incoming),outAmount=numberOf(d.out),currency=(d.incoming.match(/[A-Z]{3}/)||['USD'])[0];S.transactions.unshift([d.date,'买入',`+$${money(inAmount)} ${currency}`,d.out,d.fee,currency]);if(currency==='USD'){S.balance+=inAmount;S.cost+=outAmount+numberOf(d.fee)}if(currency==='CAD'){S.cadBalance+=inAmount;S.cadCost+=outAmount+numberOf(d.fee)}if(back==='plan-detail')S.planProgress=Math.min(100,Math.round((S.planProgress+inAmount/25000*100)*10)/10);if(back==='accounts'){S.accountCurrency=currency;S.accountTab='records'}S.entryReturn='accounts';S.entryDraft=null;closeModal();go(back);toast(back==='plan-detail'?'交易已匹配批次，计划进度已更新':'交易已写入演示账本')}
function goalForm(editIndex=null){S.editGoalIndex=editIndex;S.goalDraft=editIndex==null?NEW_GOAL():{...S.goals[editIndex],date:S.goals[editIndex].date||'2027-08-01',base:S.goals[editIndex].base||'CNY'};const g=S.goalDraft;openModal(`<h2>${editIndex==null?'创建资金准备目标':'编辑资金准备目标'}</h2><p>只填写最低必要信息；目标金额采用净到账口径。</p><div class="form-grid"><div class="field full"><label>目标名称</label><input id="g-name" value="${g.name}"></div><div class="field"><label>目标币种</label><select id="g-currency"><option>${g.currency}</option><option>CAD</option></select></div><div class="field"><label>净到账金额</label><input id="g-amount" value="${g.amount}"></div><div class="field"><label>预计使用日期</label><input id="g-date" type="date" value="${g.date}"></div><div class="field"><label>本位币</label><select id="g-base"><option>${g.base}</option><option>HKD</option></select></div></div>${modalActions('继续选择偏好','goal-preference')}`);$('[data-modal-action="goal-preference"]').onclick=captureGoal}
function captureGoal(){S.goalDraft={name:$('#g-name').value.trim(),currency:$('#g-currency').value,amount:$('#g-amount').value.trim(),date:$('#g-date').value,base:$('#g-base').value,preference:S.goalDraft.preference||'均衡型'};goalPreference()}
function goalPreference(){const prefs=[['安心型','更早建立保护线'],['均衡型','节奏与灵活性平衡'],['主动型','保留更多调整空间']];openModal(`<h2>选择资金准备偏好</h2><p>偏好只影响分批节奏与保护线，不代表汇率方向判断。</p><div class="choices">${prefs.map(p=>`<button class="choice ${S.goalDraft.preference===p[0]?'selected':''}" data-pref="${p[0]}"><b>${p[0]}${p[0]==='均衡型'?' · 推荐':''}</b><small>${p[1]}</small></button>`).join('')}</div>${modalActions('生成计划预览','goal-preview')}`);document.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>{S.goalDraft.preference=b.dataset.pref;goalPreference()});$('[data-modal-action="goal-preview"]').onclick=goalPreview}
function goalPreview(){const g=S.goalDraft;openModal(`<h2>确认计划预览</h2><p>正式确认前仍可返回修改；演示不会执行任何交易。</p><div class="review"><dl><div><dt>目标名称</dt><dd>${g.name}</dd></div><div><dt>目标</dt><dd>${g.amount} ${g.currency}</dd></div><div><dt>偏好</dt><dd>${g.preference}</dd></div><div><dt>计划节点</dt><dd>5 个</dd></div><div><dt>最晚安全日期</dt><dd>2027-07-12</dd></div><div><dt>本位币</dt><dd>${g.base}</dd></div></dl></div>${modalActions('正式确认计划','confirm-goal')}`);$('[data-modal-action="confirm-goal"]').onclick=confirmGoal}
function confirmGoal(){const g={...S.goalDraft,progress:0,safety:'2027-07-12',status:'监测中'};if(S.editGoalIndex==null){const draft=S.goals.findIndex(x=>x.status==='草稿'&&x.currency===g.currency);if(draft>=0)S.goals[draft]=g;else S.goals.push(g)}else S.goals[S.editGoalIndex]=g;S.editGoalIndex=null;closeModal();go('plans');toast('计划已确认并开始监测')}
function act(a,el){if(a==='quick-entry'){S.entryReturn='accounts';entryMethod()}if(a==='record-execution'){S.entryReturn='plan-detail';entryForm()}if(a==='new-goal')goalForm();if(a==='edit-goal')goalForm(Number(el.dataset.goalIndex));if(a==='open-plan')go('plan-detail');if(a==='adopt-route'){go('plan-detail');toast('路径已加入计划依据')}if(a==='refresh-routes')toast('报价快照已刷新');if(a==='run-replay'){const amount=numberOf($('#r-amount').value),fee=numberOf($('#r-fee').value),rate=5.2261,actual=Math.round((amount+fee)*rate),one=Math.round(actual*1.0046),diff=one-actual;$('#replay-result').innerHTML=`<h2>历史比较结果</h2><p class="sub">输入条件：${money(amount)} CAD · 固定费用 ${money(fee)} CAD · 历史节点 3 个</p><div class="route best"><strong>实际分批路径</strong><b>CNY ${money(actual)}</b><span>完整数据</span><span class="status">可复现</span></div><div class="route"><strong>一次性路径</strong><b>CNY ${money(one)}</b><span>+CNY ${money(diff)}</span><span class="status">仅历史比较</span></div>`;toast('历史回放完成')}if(a==='download-report')downloadReport();if(a==='create-report'){const n=S.reports.length+1;S.reports.unshift([`资金规划报告 ${n}`,`report_${String(n).padStart(2,'0')}.pdf`,'已完成']);render();toast('报告任务已完成，可下载')}if(a==='save-settings'){S.settings={base:$('#set-base').value,language:$('#set-language').value,threshold:$('#set-threshold').value};toast('设置已保存到当前演示会话')}if(a==='privacy')openModal('<h2>数据授权</h2><p>当前演示仅使用浏览器内存，不连接真实账户、模型或第三方数据源。</p><div class="review"><dl><div><dt>账户数据</dt><dd>未授权</dd></div><div><dt>共享数据</dt><dd>未授权</dd></div><div><dt>本地演示状态</dt><dd>关闭页面后清除</dd></div></dl></div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">知道了</button></div>')}
function downloadReport(){const b=new Blob(['FXplanner 演示报告\n净到账目标：25,000 CAD\n当前进度：'+S.planProgress+'%\n边界：规划演示，不执行交易\n'],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FXplanner-演示报告.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('报告已生成并开始下载')}
render();
</script></body></html>
